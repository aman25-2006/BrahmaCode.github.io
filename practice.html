<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrahmaCode | Coding Practice</title>
    <meta name="description" content="Practice coding problems by difficulty with a simple problem list and solve flow." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-nav">
      <a class="brand" href="index.html">
        <img src="assets/brahmacode-logo.svg" alt="BrahmaCode logo" class="brand-logo" />
        <span class="brand-text">Brahma<span>Code</span></span>
      </a>
      <button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav">
        Menu
      </button>
      <nav id="main-nav">
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="practice.html">Practice</a>
        <a href="ask-doubt.html">Doubts</a>
        <a href="jobs.html">Jobs</a>
        <a href="articles.html">Articles</a>
        <a href="admin-login.html">Admin</a>
        <a href="google-login.html" class="nav-auth-link">Login</a>
        <a href="google-login.html" class="nav-auth-link nav-auth-primary">Signup</a>
      </nav>
    </header>

    <main class="page-wrap">
      <section class="hero section reveal">
        <p class="tiny-label">problem solving • interview prep</p>
        <h1>Coding Practice</h1>
        <p class="hero-subtext">Pick a problem, read constraints, and submit your solution in the editor.</p>
      </section>

      <section class="section reveal" data-section-key="showPracticeSection">
        <div class="section-intro">
          <h2>Problem List</h2>
          <p>Filter by difficulty and start solving.</p>
        </div>

        <div class="toolbar-row">
          <label for="difficulty-filter">Difficulty</label>
          <select id="difficulty-filter">
            <option value="all">All</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>

        <div id="problems-list" class="content-grid"></div>
      </section>
    </main>

    <footer class="footer section page-wrap">
      <p class="founder">Founder: Aman Kumar</p>
      <p class="copy">BrahmaCode © 2026</p>
    </footer>

    <script src="script.js"></script>
    <script src="data-store.js"></script>
    <script src="portal.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
